      <div class="animal-card">

          🦮

            <span>Castrado</span>

      </div>

      <div class="animal-card">

        <div class="icone">
          🐈‍⬛
        </div>

        <div class="info">

          <div class="linha-topo">

            <h2>Mimi</h2>

            <span class="status disponivel">
              Disponível
            </span>

          </div>

          <p>
            Gato • Pequeno • 3 anos
          </p>

          <div class="tags">
            <span>Vacinado</span>
          </div>

        </div>

      </div>

      <div class="animal-card">

        <div class="icone">
          🦮
        </div>

        <div class="info">

          <div class="linha-topo">

            <h2>Rex</h2>

            <span class="status adotado">
              Adotado
            </span>

          </div>

            Cachorro • Grande • 4 anos
          </p>

        Ver todos os animais
