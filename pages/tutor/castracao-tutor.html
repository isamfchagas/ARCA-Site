<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Castração - ARCA</title>

  <link rel="stylesheet" href="../../assets/css/castracao-tutor.css">
</head>

<body>

  <header class="header">
    <div class="nav-wrapper">

      <div class="nav-logo">
        <img src="../../assets/imgs/logoarca.png" alt="Logo ARCA">
      </div>

      <nav class="nav-menu">
        <ul class="nav-list">
          <li class="nav-item"><a href="meus-animais-tutor.html">Meus Animais</a></li>
          <li class="nav-item"><a href="solicitacoes-tutor.html">Solicitações</a></li>
          <li class="nav-item"><a href="castracao-tutor.html">Castração</a></li>
          <li class="nav-item"><a href="historico-tutor.html">Histórico</a></li>
        </ul>
      </nav>


      <a href="perfil-tutor.html" class="nav-btn">Meu Perfil</a>
      
    </div>
  </header>

  <div class="container">

    <header class="topo">

      <div>
        <h1>Agendar castração</h1>
        <p>Clínicas parceiras</p>
      </div>

    </header>

    <main class="conteudo">

      <div class="campo">

        <label>Selecionar animal</label>

        <select>
          <option>Mimi — Gata, não castrada</option>
          <option>Bolinha — Cachorro</option>
          <option>Rex — Cachorro</option>
        </select>

      </div>

      <h2 class="titulo">
        Clínicas disponíveis
      </h2>

    

      <div class="clinica ativa">

        <div class="icone">
          🏥
        </div>

        <div class="info">

          <div class="linha-topo">

            <h3>Clínica VidaPet</h3>

            <span class="tag verde">
              Gratuito
            </span>

          </div>

          <p>
            Serra • 1,3 km
          </p>

          <div class="tags">

            <span class="tag disponibilidade">
              Vagas disponíveis
            </span>

          </div>

        </div>

      </div>

      

      <div class="clinica">

        <div class="icone">
          🏥
        </div>

        <div class="info">

          <div class="linha-topo">

            <h3>PetCare ES</h3>

            <span class="tag amarelo">
              Últimas vagas
            </span>

          </div>

          <p>
            Serra • 3,1 km
          </p>

        </div>

      </div>

      <div class="campo">

        <label>Data preferida</label>

        <input type="date">

      </div>
      <a href="historico-tutor.html">
      <button class="confirmar-btn">
        Confirmar agendamento →
      </button>
      </a>

    </main>

  </div>

</body>

</html>
